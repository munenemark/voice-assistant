<!DOCTYPE html>
<html>
<head>
    <title>Voice Assistant</title>
    <style>
        /* 1. Page Background & Centering */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* 2. The Main Interface */
        .assistant-container {
            text-align: center;
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            width: 350px;
        }

        /* 3. The Microphone Button */
        #talkBtn {
            background-color: #ff0050;
            color: white;
            border: none;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 80, 0.4);
            transition: 0.3s;
            margin-bottom: 20px;
        }

        #talkBtn:hover {
            transform: scale(1.1);
            background-color: #e60048;
        }

        /* Animation class for when the assistant is actively listening */
        .listening {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 80, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(255, 0, 80, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 80, 0); }
        }

        /* 4. Text Displays */
        .transcript-box {
            min-height: 50px;
            margin-top: 20px;
            padding: 15px;
            background-color: #2c2c2c;
            border-radius: 10px;
            font-style: italic;
            color: #aaa;
        }

        .response-box {
            min-height: 50px;
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #00ffcc;
        }
    </style>
</head>
<body>
    <div class="assistant-container">
        <h2>Web Assistant</h2>
        
        <button id="talkBtn" onclick="startListening()">🎤</button>
        
        <div class="transcript-box" id="userText">
            Click the mic and say "Hello" or "What time is it"...
        </div>
        
        <div class="response-box" id="assistantText">
            Waiting for your command...
        </div>
    </div>

    <script>
        // 1. Setup the Speech Recognition (Listening)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        // If the browser doesn't support it, show an error
        if (!SpeechRecognition) {
            alert("Sorry, your browser does not support Voice Recognition. Try using Google Chrome!");
        }
        
        const recognition = new SpeechRecognition();
        
        // 2. Setup the Speech Synthesis (Talking)
        const synth = window.speechSynthesis;

        function startListening() {
            let btn = document.getElementById('talkBtn');
            btn.classList.add('listening'); // Add pulsing animation
            document.getElementById('userText').innerText = "Listening...";
            document.getElementById('assistantText').innerText = "";
            
            recognition.start();
        }

        // 3. What happens when it hears you
        recognition.onresult = function(event) {
            // Stop the pulsing animation
            document.getElementById('talkBtn').classList.remove('listening');
            
            // Get the exact words you said
            let transcript = event.results[0][0].transcript.toLowerCase();
            document.getElementById('userText').innerText = `You said: "${transcript}"`;
            
            // Figure out how to respond
            processCommand(transcript);
        };

        // If it stops listening without hearing anything
        recognition.onspeechend = function() {
            document.getElementById('talkBtn').classList.remove('listening');
            recognition.stop();
        }

        // 4. The Brain of the Assistant
        function processCommand(command) {
            let response = "";

            if (command.includes("hello") || command.includes("hi")) {
                response = "Hello there! How can I help you today?";
            } 
            else if (command.includes("time")) {
                let now = new Date();
                response = "The current time is " + now.toLocaleTimeString();
            }
            else if (command.includes("name")) {
                response = "I am your JavaScript web assistant.";
            }
            else if (command.includes("joke")) {
                response = "Why do programmers prefer dark mode? Because light attracts bugs!";
            }
            else {
                response = "I heard you, but I don't know how to respond to that yet.";
            }

            speakOutLoud(response);
        }

        // 5. Function to make the computer speak
        function speakOutLoud(text) {
            document.getElementById('assistantText').innerText = text;
            let utterance = new SpeechSynthesisUtterance(text);
            synth.speak(utterance);
        }
    </script>
</body>
</html>
